<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil Mestre</title>
    <link rel="stylesheet" href="editarperfilmestre.css">

    <header>
        <a href="home.html"><h1>DEDOMÉNA</h1></a>
        <div class="itens_esquerda">
            <a href="login.html"><h3> Login </h3></a>
            <a href="criarconta.html"><h3> Criar conta </h3></a>
            <a href="#" id="profileBtn"><h3>Perfil</h3></a>
        </div>
      </header>
</head>
<body>
    <h1>Editar Perfil Mestre</h1>
    <form id="editProfileForm">
        <label for="editName">Nome:</label>
        <input type="text" id="editName" required>
        <br>
        <label for="editEmail">Email:</label>
        <input type="email" id="editEmail" required>
        <br>
        <button type="submit">Salvar Alterações</button>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const users = JSON.parse(localStorage.getItem("users")) || [];
            const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
    
            if (!loggedUser) {
                window.location.href = "login.html";
                return;
            }
    
            const userIndex = users.findIndex(u => u.email === loggedUser.email);
            if (userIndex === -1) {
                alert("Usuário não encontrado!");
                window.location.href = "login.html";
                return;
            }
    
            
            document.getElementById("editName").value = loggedUser.name;
            document.getElementById("editEmail").value = loggedUser.email;
    
            document.getElementById("editProfileForm").addEventListener("submit", function(event) {
                event.preventDefault();
    
                const updatedName = document.getElementById("editName").value;
                const updatedEmail = document.getElementById("editEmail").value;
    
                
                users[userIndex].name = updatedName;
                users[userIndex].email = updatedEmail;
    
                
                localStorage.setItem("users", JSON.stringify(users));
                localStorage.setItem("loggedUser", JSON.stringify(users[userIndex]));
    
                alert("Perfil atualizado com sucesso!");
                window.location.href = "perfilmestre.html";
            });
        });
    </script>
    
</html>
